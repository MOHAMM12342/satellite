<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Connexion sécurisée{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
    }

    .navbar {
      background-color: #0d6efd;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 2rem;
    }

    .form-label {
      font-weight: 500;
      color: #0d1a26;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    h3 {
      color: #0d6efd;
      margin-bottom: 1rem;
    }

    p.text-muted {
      font-size: 0.95rem;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">Authentification d'admin</a>
    </div>
  </nav>

  <div class="container d-flex align-items-center justify-content-center" style="min-height: 90vh;">
    <div class="col-md-6">
      {% block content_wrapper %}
        <div class="card">
          <h3 class="text-center">Connexion Sécurisée</h3>
          <p class="text-muted text-center">Merci d’entrer vos identifiants ou votre code à usage unique.</p>

          {% block content %}
          <!-- Contenu 2FA ici -->
          {% endblock %}
        </div>
      {% endblock %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  {% block extra_media %}{% endblock %}
</body>
</html>
